name: Sync and publish fixed ICS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate fixed ICS
        env:
          OFFICE_ICS_URL: ${{ secrets.OFFICE_ICS_URL }}
          OUT_ICS_PATH: public/calendar_fixed.ics
          # 1 = publish "Busy" only, 0 = publish full details (NOT recommended)
          SCRUB_DETAILS: "1"
        run: |
          python sync_ics.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/calendar_fixed.ics || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update fixed ICS"
          git push
