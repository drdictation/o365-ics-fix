name: Sync and publish fixed ICS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate fixed ICS (root)
        env:
          OFFICE_ICS_URL: ${{ secrets.OFFICE_ICS_URL }}
          OUT_ICS_PATH: calendar_fixed.ics
          SCRUB_DETAILS: "1"
        run: |
          python sync_ics.py

      - name: Repair malformed ICS (remove nested VEVENT blocks)
        run: |
          python - <<'PY'
          import re

          path = "calendar_fixed.ics"
          raw = open(path, "r", encoding="utf-8", errors="ignore").read()

          # Normalize newlines
          raw = raw.replace("\r\n", "\n").replace("\r", "\n")

          lines = raw.split("\n")

          out = []
          vevent_depth = 0
          skipping_nested = False
          nested_depth = 0

          for line in lines:
            if line == "BEGIN:VEVENT":
              if vevent_depth == 0:
                vevent_depth = 1
                out.append(line)
              else:
                # nested VEVENT -> skip until its END:VEVENT
                skipping_nested = True
                nested_depth = 1
              continue

            if line == "END:VEVENT":
              if skipping_nested:
                nested_depth -= 1
                if nested_depth <= 0:
                  skipping_nested = False
                continue
              else:
                if vevent_depth > 0:
                  vevent_depth = 0
                out.append(line)
                continue

            if skipping_nested:
              # track any extra nesting just in case
              if line == "BEGIN:VEVENT":
                nested_depth += 1
              elif line == "END:VEVENT":
                nested_depth -= 1
              continue

            out.append(line)

          fixed = "\n".join(out)

          # Extra hardening: kill the common broken pattern exactly (if still present)
          fixed = fixed.replace("BEGIN:VEVENT\nCLASS:PUBLIC\nEND:VEVENT\n", "CLASS:PUBLIC\n")

          # Ensure file ends cleanly with END:VCALENDAR
          if "END:VCALENDAR" not in fixed:
            # if it got lost somehow, append it
            fixed = fixed.rstrip("\n") + "\nEND:VCALENDAR\n"
          else:
            # remove anything after END:VCALENDAR
            fixed = fixed.split("END:VCALENDAR", 1)[0] + "END:VCALENDAR\n"

          open(path, "w", encoding="utf-8").write(fixed)
          print("ICS repaired: nested VEVENT blocks removed.")
          PY

      - name: Commit updated ICS
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add calendar_fixed.ics
          git commit -m "Update fixed ICS" || exit 0
          git push
