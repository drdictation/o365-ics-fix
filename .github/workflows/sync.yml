name: Publish Calendar ICS

on:
  push:
    branches: ["main"]
    paths:
      - "calendar.ics"
      - ".github/workflows/publish_calendar.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - List repository files
        run: |
          echo "Repository contents:"
          ls -R

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          pip install icalendar

      - name: Repair ICS (denest + normalise TZID exceptions to UTC)
        run: |
          python << 'PY'
          import os
          from icalendar import Calendar
          from datetime import timezone

          SRC = "calendar.ics"
          DST = "calendar_fixed.ics"

          if not os.path.exists(SRC):
              raise FileNotFoundError(f"{SRC} not found in repository root.")

          with open(SRC, "rb") as f:
              cal = Calendar.from_ical(f.read())

          new_cal = Calendar()
          for k, v in cal.property_items():
              new_cal.add(k, v)

          for component in cal.walk():
              if component.name == "VEVENT":
                  if component.get("DTSTART") and hasattr(component["DTSTART"], "dt"):
                      dt = component["DTSTART"].dt
                      if hasattr(dt, "tzinfo") and dt.tzinfo is not None:
                          component["DTSTART"].dt = dt.astimezone(timezone.utc)

                  if component.get("DTEND") and hasattr(component["DTEND"], "dt"):
                      dt = component["DTEND"].dt
                      if hasattr(dt, "tzinfo") and dt.tzinfo is not None:
                          component["DTEND"].dt = dt.astimezone(timezone.utc)

                  new_cal.add_component(component)

          with open(DST, "wb") as f:
              f.write(new_cal.to_ical())

          print("ICS repaired successfully.")
          PY

      - name: Prepare Pages content
        run: |
          mkdir public
          cp calendar_fixed.ics public/calendar.ics

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
