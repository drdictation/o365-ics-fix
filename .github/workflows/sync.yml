name: Sync and publish fixed ICS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Fetch ICS
        run: |
          curl -L "${{ secrets.OFFICE_ICS_URL }}" -o calendar.ics
      - name: Fix timezone issue
        run: |
          sed 's;TZID=AUS Eastern Standard Time:;g' calendar.ics > calendar_fixed.ics

      - name: Commit updated ICS
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add calendar_fixed.ics
          git commit -m "Update ICS" || echo "No changes"
          git push
