name: Sync and publish fixed ICS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate fixed ICS (root)
        env:
          OFFICE_ICS_URL: ${{ secrets.OFFICE_ICS_URL }}
          OUT_ICS_PATH: calendar_fixed.ics
          SCRUB_DETAILS: "1"
        run: |
          python sync_ics.py

      - name: Remove invalid nested VEVENT blocks
        run: |
          python - <<'PY'
          p = "calendar_fixed.ics"
          s = open(p, "r", encoding="utf-8", errors="ignore").read()

          # Remove the broken nested VEVENT block
          s = s.replace(
              "BEGIN:VEVENT\nCLASS:PUBLIC\nEND:VEVENT\n",
              "CLASS:PUBLIC\n"
          )

          open(p, "w", encoding="utf-8").write(s)
          print("Patched nested VEVENT blocks.")
          PY

      - name: Commit updated ICS
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add calendar_fixed.ics
          git commit -m "Update fixed ICS" || exit 0
          git push
