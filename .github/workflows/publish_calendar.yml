name: Publish Calendar ICS

on:
  schedule:
    # Run every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch calendar from Microsoft 365
        env:
          MS_CALENDAR_ICS_URL: ${{ secrets.MS_CALENDAR_ICS_URL }}
        run: |
          if [ -z "$MS_CALENDAR_ICS_URL" ]; then
            echo "❌ MS_CALENDAR_ICS_URL secret is not set!"
            echo "Go to repo Settings → Secrets → Actions → New secret"
            echo "Name: MS_CALENDAR_ICS_URL"
            echo "Value: your Outlook published ICS URL"
            exit 1
          fi
          echo "Fetching calendar from Microsoft 365..."
          curl -fSL --retry 3 --retry-delay 5 -o calendar.ics "$MS_CALENDAR_ICS_URL"
          LINES=$(wc -l < calendar.ics)
          EVENTS=$(grep -c "BEGIN:VEVENT" calendar.ics || true)
          echo "✅ Fetched calendar.ics ($LINES lines, $EVENTS events)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install icalendar

      - name: Repair ICS for Google Calendar compatibility
        run: python repair_ics.py

      - name: Validate repaired ICS
        run: |
          python << 'PY'
          from icalendar import Calendar
          with open("public/calendar.ics", "rb") as f:
              cal = Calendar.from_ical(f.read())
          events = [c for c in cal.walk() if c.name == "VEVENT"]
          print(f"✅ Validated: {len(events)} events in repaired ICS")
          with open("public/calendar.ics", "r") as f:
              content = f.read()
          bad_tzids = [
              "AUS Eastern Standard Time",
              "Eastern Standard Time",
              "Pacific Standard Time",
          ]
          for tz in bad_tzids:
              if tz in content:
                  print(f"⚠️  WARNING: Microsoft TZID '{tz}' still present!")
                  exit(1)
          print("✅ All TZIDs are IANA-compliant")
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
